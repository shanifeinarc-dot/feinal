<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta property="og:title" content="שאלון היכרות | FEINAL">

<title>שאלון היכרות FEINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap">
<style>
/* Layout: one calm card per question, centered on a warm stone ground; brand gold for actions, mint slant as the FEINAL signature. */
:root{
  --bg:#F7F4EF; --card:#FFFFFF; --ink:#2B2622; --muted:#7A7068; --line:#E6DFD5;
  --gold:#A8834F; --gold-ink:#FFFFFF; --gold-soft:#F1E8DA; --mint:#7FB5AC; --mint-soft:#E4F0EE;
  --f:"Heebo",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1916; --card:#25211D; --ink:#EEE8E0; --muted:#A99F94; --line:#3A342E;
  --gold:#C9A36A; --gold-ink:#1C1916; --gold-soft:#3A3024; --mint:#8CC7BD; --mint-soft:#1F3330; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1916; --card:#25211D; --ink:#EEE8E0; --muted:#A99F94; --line:#3A342E;
  --gold:#C9A36A; --gold-ink:#1C1916; --gold-soft:#3A3024; --mint:#8CC7BD; --mint-soft:#1F3330; color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{width:120px;height:auto;display:block}
.step-n{font-size:.82rem;color:var(--muted);letter-spacing:.04em}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .35s ease}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 2px rgba(43,38,34,.04),0 10px 30px rgba(43,38,34,.05)}
h1{font-weight:300;font-size:1.65rem;margin:0;line-height:1.3;text-wrap:balance;letter-spacing:.01em}
h1::before{content:"";display:inline-block;width:24px;height:10px;background:var(--mint);transform:skewX(-24deg);margin-inline-end:10px;vertical-align:middle;border-radius:1px}
.sub{color:var(--muted);margin:-8px 0 0}
label.q{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:.95rem}
label.q span.h{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=tel],input[type=number],input[type=month],textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.chip:hover{border-color:var(--gold)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.qlabel{font-weight:500;font-size:.95rem;margin-bottom:-8px}
.range{display:flex;align-items:center;gap:12px}
.range input[type=range]{flex:1;accent-color:var(--gold)}
.range output{min-width:82px;text-align:center;font-weight:500;font-variant-numeric:tabular-nums;background:var(--gold-soft);border-radius:10px;padding:6px 8px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.2rem;cursor:pointer}
.stepper output{min-width:40px;text-align:center;font-size:1.2rem;font-weight:500}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{font:inherit;font-weight:500;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;background:var(--gold);color:var(--gold-ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--muted);padding-inline:6px}
.btn.wide{width:100%}
.btn.mint{background:var(--mint);color:#1C1916}
.upload{display:flex;align-items:center;gap:14px;border:1.5px dashed var(--line);border-radius:14px;padding:14px;background:var(--card);cursor:pointer;transition:border-color .15s}
.upload:hover{border-color:var(--gold)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.upload .thumb{width:64px;height:64px;border-radius:10px;background:var(--gold-soft);display:grid;place-items:center;flex:none;overflow:hidden;font-size:1.5rem}
.upload .thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.upload .ut{display:flex;flex-direction:column;gap:2px;min-width:0}
.upload .ut b{font-weight:500}.upload .ut small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{margin:0;display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:0;border-top:1px solid var(--line)}
.view dt,.view dd{margin:0;padding:10px 4px;border-bottom:1px solid var(--line)}
.view dt{color:var(--muted);font-size:.9rem}
.view dd{white-space:pre-wrap;overflow-wrap:anywhere}
@media print{.noprint,.bar,.step-n{display:none!important}body{background:#fff}}
.linkbtn{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;align-self:flex-start}
.cheer{font-size:.88rem;color:var(--muted);text-align:center;min-height:1.4em}
.summary{background:var(--mint-soft);border-radius:14px;padding:14px 16px;font-size:.9rem;white-space:pre-wrap;max-height:280px;overflow:auto}
.foot{text-align:center;font-size:.78rem;color:var(--muted)}
.foot a{color:inherit}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
</style>
</head>

 {id:'budget',title:'תקציב וזמנים',sub:'הערכה מספיקה. זה עוזר לנו להתאים את ההמלצות למה שנכון לכם.',fields:[{k:'budget',type:'chips',label:'תקציב משוער לביצוע (שיפוץ, נגרות, תאורה)',opts:['עד 50 אלף','50–100 אלף','100–200 אלף','200–400 אלף','מעל 400 אלף','עוד לא יודעים']},{k:'decider',type:'text',label:'מי מקבל את ההחלטות בעסק?'},{k:'contractor',type:'chips',label:'יש כבר קבלן מבצע?',opts:['כן','עוד לא']}],cheer:'עוד שלב אחד.'},
 {id:'more',title:'עוד משהו שחשוב לנו לדעת?',fields:[{k:'more',type:'textarea',label:'כל מה שעולה לכם: חלומות, חששות, השראות'}],cheer:'זהו, סיימתם!'}
];
let i=Math.min(+(A.__step||0),STEPS.length);

function field(f){
 const v=A[f.k];
 if(f.type==='file'){const vis=!f.showIf||f.showIf(A);const isImg=LOGO&&/^image\//.test(LOGO.type);
  return `<div id="w-${f.k}" ${vis?'':'hidden'}><div class="qlabel">${esc(f.label)}</div><label class="upload"><input type="file" id="f-${f.k}" accept="image/*,.pdf,.ai,.eps,.svg"><span class="thumb">${LOGO?(isImg?`<img src="${LOGO.data}" alt="">`:'📄'):'⬆️'}</span><span class="ut"><b>${LOGO?'הלוגו עלה ✓':'בחירת קובץ'}</b><small>${LOGO?esc(LOGO.name):'תמונה, PDF או קובץ גרפי'}</small></span></label>${LOGO?'<button type="button" class="linkbtn" id="rmLogo">הסרת הקובץ</button>':''}</div>`}
 if(f.type==='text'||f.type==='tel'||f.type==='month')return `<label class="q">${esc(f.label)}<input id="f-${f.k}" data-k="${f.k}" type="${f.type}" value="${esc(v||'')}" ${f.type==='tel'?'inputmode="tel" dir="ltr" style="text-align:right"':''}></label>`;
 if(f.type==='textarea')return `<label class="q">${esc(f.label)}<textarea id="f-${f.k}" data-k="${f.k}">${esc(v||'')}</textarea></label>`;
 if(f.type==='chips'||f.type==='multi'){const sel=f.type==='multi'?(v||[]):[v];return `${f.label?`<div class="qlabel">${esc(f.label)}</div>`:''}<div class="chips" role="group">${f.opts.map(o=>`<button type="button" class="chip" data-chip="${f.k}" data-multi="${f.type==='multi'?1:0}" data-max="${f.max||0}" data-v="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join('')}</div>`}
 if(f.type==='range'){const val=v||f.def;return `<label class="q" for="f-${f.k}">${esc(f.label)}</label><div class="range"><input id="f-${f.k}" data-k="${f.k}" type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}"><output id="o-${f.k}">${val} מ"ר</output></div>`}
 if(f.type==='stepper'){const val=v??f.def;return `<div class="qlabel">${esc(f.label)}</div><div class="stepper"><button type="button" data-step="${f.k}" data-d="-1" data-min="${f.min}" data-max="${f.max}" aria-label="פחות">−</button><output id="o-${f.k}">${val}</output><button type="button" data-step="${f.k}" data-d="1" data-min="${f.min}" data-max="${f.max}" aria-label="יותר">+</button></div>`}
 return '';
}
function summaryText(){
 const L=[`שלום שני, מילאתי את שאלון ההיכרות של FEINAL:`,''];
 const add=(t,v)=>{if(v===undefined||v===''||v===null||(Array.isArray(v)&&!v.length))return;L.push(`${t}: ${Array.isArray(v)?v.join(', '):v}`)};
 add('שם העסק',A.biz);add('שם',A.name);add('טלפון',A.phone);add('תחום',A.type);add('מה אנחנו מוכרים',A.typeMore);
 add('עיר',A.city);add('שטח (מ"ר)',A.area);add('מצב העסק',A.status);add('פתיחה מתוכננת',A.open);
 add('לקוחות',A.audience);add('למה בוחרים בנו',A.why);add('הרגשה',A.feel);add('צריך בחלל',A.needs);add('מוצרים',A.products);
 add('עובדים במשמרת',A.staff);add('לקוחות ביום',A.traffic);add('שעות עומס',A.peak);add('סגנון',A.style);add('מיתוג קיים',A.brand);if(LOGO)L.push('לוגו: מצורף בהודעה נפרדת ('+LOGO.name+')');add('לא רוצים',A.nope);
 add('רישיון עסק',A.license);add('משרד הבריאות',A.health);add('הנחיות קניון/משכיר',A.mall);add('DWG/מדידה',A.dwg);
 add('תקציב לביצוע',A.budget);add('מי מחליט',A.decider);add('קבלן',A.contractor);add('עוד',A.more);
 return L.join('\n');
}
function render(){
 const card=document.getElementById('card');
 const total=STEPS.length;
 document.getElementById('barFill').style.width=Math.round(Math.min(i,total)/total*100)+'%';
 if(i>=total){
  document.getElementById('stepN').textContent='סיום';
  const txt=summaryText()+(isHttp?'\n\nלצפייה מלאה ומסודרת בתשובות:\n'+viewLink():'');
  card.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;gap:16px"><h1>תודה רבה!</h1><p class="sub" style="margin:0">עוד צעד אחד: שלחו לנו את התשובות בוואטסאפ, ואנחנו נעבור עליהן לפני הפגישה.</p>
  <a class="btn wide" id="wa" target="_blank" rel="noopener" href="https://wa.me/${PHONE}?text=${encodeURIComponent(txt)}">שליחת התשובות בוואטסאפ</a>
  ${LOGO?`<button type="button" class="btn wide" id="shareLogo">שליחת הלוגו לשני</button>`:''}
  <button type="button" class="btn mint wide" id="copy">העתקת התשובות</button>
  <p class="sub" style="margin:0;font-size:.88rem">אם ההודעה לא נפתחה, העתיקו את התשובות והדביקו אותן בוואטסאפ למספר 054-8461074. אפשר גם לצרף שם תמונות של המקום, וקובץ DWG אם יש.</p>
  <div class="summary" id="sum">${esc(txt)}</div>
  <div class="nav"><button type="button" class="btn ghost" id="back">חזרה לעריכה</button></div></div>`;
  document.getElementById('cheer').textContent='';
  document.getElementById('copy').onclick=()=>{const t=summaryText();const done=()=>{document.getElementById('copy').textContent='הועתק ✓'};try{navigator.clipboard.writeText(t).then(done,()=>selectSum())}catch(e){selectSum()}};
  const sl=document.getElementById('shareLogo');
  if(sl)sl.onclick=async()=>{const f=logoFile();
   try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'הלוגו של '+(A.biz||'העסק')});sl.textContent='הלוגו נשלח ✓';return}}catch(e){if(e&&e.name==='AbortError')return}
   const a=document.createElement('a');a.href=LOGO.data;a.download=LOGO.name;document.body.appendChild(a);a.click();a.remove();
   sl.textContent='הלוגו ירד למכשיר. צרפו אותו בוואטסאפ לשני';};
  document.getElementById('back').onclick=()=>{i=total-1;A.__step=i;save();render()};
  return;
 }
 const s=STEPS[i];
 document.getElementById('stepN').textContent=`שאלה ${i+1} מתוך ${total}`;
 card.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;gap:18px"><h1>${esc(s.title)}</h1>${s.sub?`<p class="sub">${esc(s.sub)}</p>`:''}${s.fields.map(field).join('')}
 <div class="nav">${i>0?'<button type="button" class="btn ghost" id="prev">הקודם</button>':'<span></span>'}<button type="button" class="btn" id="next">${i===total-1?'סיום':(i===0?'יאללה, מתחילים':'הבא')}</button></div></div>`;
 document.getElementById('cheer').textContent=i>0?STEPS[i-1].cheer:'';
 const n=document.getElementById('next');n.onclick=()=>{i++;A.__step=i;save();render();window.scrollTo(0,0)};
 const p=document.getElementById('prev');if(p)p.onclick=()=>{i--;A.__step=i;save();render()};
 const first=card.querySelector('input[type=text],input[type=tel]');if(first&&i===0)setTimeout(()=>first.focus(),50);
}
function selectSum(){const el=document.getElementById('sum');const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r)}
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset.k)return;A[t.dataset.k]=t.type==='range'?+t.value:t.value;if(t.type==='range'){const o=document.getElementById('o-'+t.dataset.k);if(o)o.textContent=t.value+' מ"ר'}save()});
document.addEventListener('click',e=>{
 const c=e.target.closest('[data-chip]');
 if(c){const k=c.dataset.chip,v=c.dataset.v;
  if(c.dataset.multi==='1'){let arr=Array.isArray(A[k])?A[k].slice():[];const max=+c.dataset.max;
   if(arr.includes(v))arr=arr.filter(x=>x!==v);else{if(max&&arr.length>=max)arr.shift();arr.push(v)}
   A[k]=arr;c.parentElement.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',arr.includes(b.dataset.v)))}
  else{A[k]=A[k]===v?'':v;c.parentElement.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===A[k]))}
  save();const w=document.getElementById('w-logo');if(w&&k==='brand')w.hidden=!(A.brand==='כן'||A.brand==='חלקית');return}
 const st=e.target.closest('[data-step]');
 if(st){const k=st.dataset.step;const cur=+(A[k]??STEPS.flatMap(s=>s.fields).find(f=>f.k===k).def);const v=Math.max(+st.dataset.min,Math.min(+st.dataset.max,cur+ +st.dataset.d));A[k]=v;document.getElementById('o-'+k).textContent=v;save()}
});
document.addEventListener('change',e=>{const t=e.target;if(t.id!=='f-logo'||!t.files||!t.files[0])return;const f=t.files[0];
 if(f.size>8*1024*1024){alert('הקובץ גדול מדי (עד 8MB). אפשר לשלוח אותו ישירות בוואטסאפ.');t.value='';return}
 const rd=new FileReader();rd.onload=()=>{LOGO={name:f.name,type:f.type||'application/octet-stream',data:rd.result};saveLogo();const w=document.getElementById('w-logo');w.outerHTML=field(STEPS.flatMap(s=>s.fields).find(x=>x.k==='logo'))};rd.readAsDataURL(f)});
document.addEventListener('click',e=>{if(e.target.id==='rmLogo'){LOGO=null;saveLogo();document.getElementById('w-logo').outerHTML=field(STEPS.flatMap(s=>s.fields).find(x=>x.k==='logo'))}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const n=document.getElementById('next');if(n){e.preventDefault();n.click()}}});
function renderView(){
 document.getElementById('barFill').style.width='100%';
 const card=document.getElementById('card');document.getElementById('stepN').textContent='תשובות השאלון';
 if(VIEW.__bad){card.innerHTML='<h1>הקישור לא שלם</h1><p class="sub">כנראה שחלק מהקישור נחתך בהעתקה. בקשו מהלקוח לשלוח שוב.</p>';return}
 const keep=A;A=VIEW;const lines=summaryText().split('\n').slice(2);A=keep;
 const when=VIEW.__t?new Date(VIEW.__t).toLocaleString('he-IL',{dateStyle:'medium',timeStyle:'short'}):'';
 const rows=lines.map(l=>{const i=l.indexOf(': ');return i<0?['',l]:[l.slice(0,i),l.slice(i+2)]});
 card.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;gap:14px"><h1>${esc(VIEW.biz||'שאלון היכרות')}</h1>
 <p class="sub" style="margin:0">${esc([VIEW.name,VIEW.phone,VIEW.city].filter(Boolean).join(' · '))}${when?'<br>נשלח: '+esc(when):''}</p>
 <dl class="view">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
 <div class="nav noprint"><button type="button" class="btn" onclick="print()">הדפסה / שמירה כ־PDF</button><button type="button" class="btn mint" id="cpv">העתקה</button></div></div>`;
 document.getElementById('cpv').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(rows.map(r=>r[0]+': '+r[1]).join('\n')).then(()=>document.getElementById('cpv').textContent='הועתק ✓')};
 document.getElementById('cheer').textContent='';
}
if(VIEW)renderView();else render();
})();
</script>

</body>
