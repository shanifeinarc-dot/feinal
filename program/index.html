<style>
:root{
 --bg:#F7F4EF;--card:#FFFFFF;--ink:#2B2622;--muted:#7A7068;--line:#E6DFD5;--soft:#FBF9F6;
 --stone:#1E1B18;--gold:#A8834F;--gold-d:#8E6C3E;--gold-l:#C9A36A;--gold-soft:#F3EBDD;
 --mint:#A9D6CF;--mint-d:#6FAFA5;--mint-soft:#E6F2F0;--err:#B4533B;--err-soft:#F8E9E4;
 --f:"Heebo",system-ui,"Segoe UI",Arial,sans-serif;--r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;font-weight:400}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(247,244,239,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:0 -16px;padding:12px 16px 10px;border-bottom:1px solid transparent}
.top.sh{border-bottom-color:var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:26px;display:block}
.stepinfo{font-size:.82rem;color:var(--muted);text-align:left;line-height:1.3}
.stepinfo b{display:block;color:var(--ink);font-weight:500;font-size:.9rem}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-l),var(--gold));border-radius:3px;transition:width .4s ease}

.hero:after{content:"";position:absolute;left:-46px;bottom:-30px;width:56px;height:150px;background:var(--mint);opacity:.4;transform:skewX(-28deg);z-index:0}
.hero.short:after{display:none}
.hero>*{position:relative;z-index:1}
.kick{font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-l);direction:ltr;text-align:center;margin:0}
.hero h1{font-weight:300;font-size:1.85rem;line-height:1.25;margin:18px 0 10px;color:#F3E9D8}
.hero p{margin:0;color:#D9CFC0;font-weight:300}
/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 18px;margin-top:16px;position:relative}
.ribbon{display:inline-block;background:var(--mint);color:#1F3B37;font-weight:500;font-size:.95rem;padding:5px 22px 5px 26px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);margin-bottom:10px}
.sec-k{font-size:.68rem;letter-spacing:.38em;color:var(--gold);direction:ltr;text-align:right;margin:0 0 2px;text-transform:uppercase}
h2{font-weight:300;font-size:1.7rem;line-height:1.25;margin:0 0 6px}
.intro{color:var(--muted);margin:0 0 6px;font-weight:300}
.fields{display:flex;flex-direction:column;margin-top:20px}
.fields>.disc>.in>*,.fields>.fld{margin-bottom:24px}
.fld{display:flex;flex-direction:column;gap:8px}
.lab{font-weight:500;font-size:1rem;line-height:1.4}
.lab .req{color:var(--gold);margin-inline-start:4px}
.hint{font-size:.85rem;color:var(--muted);margin-top:-4px;font-weight:300}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=number],textarea{width:100%;min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;transition:border-color .15s,box-shadow .15s}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(168,131,79,.16);background:#fff}
.ltr{direction:ltr;text-align:right}
.fld.bad input,.fld.bad textarea,.fld.bad .datebtn{border-color:var(--err);background:var(--err-soft)}
.errm{color:var(--err);font-size:.86rem;display:none}
.fld.bad .errm{display:block}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;cursor:pointer;font-size:.95rem;line-height:1.35;transition:background .15s,border-color .15s,color .15s,transform .08s;text-align:center}
.chip:hover{border-color:var(--gold-l)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#fff}
.chips.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips.tiles .chip{border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.chips.tiles .chip .ic{font-size:1.35rem;line-height:1}
.chip:focus-visible,.btn:focus-visible,.step button:focus-visible,.datebtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.maxn{font-size:.8rem;color:var(--muted)}
/* stepper */
.stepper{display:flex;align-items:center;gap:8px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--soft);overflow:hidden}
.step button{width:46px;height:46px;border:0;background:transparent;font-size:1.3rem;cursor:pointer;color:var(--gold-d)}
.step button:active{background:var(--gold-soft)}
.step input{width:76px;border:0!important;background:transparent!important;text-align:center;padding:10px 0;box-shadow:none!important;font-variant-numeric:tabular-nums;font-size:1.05rem;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.suf{color:var(--muted);font-size:.95rem}
/* disclosure */
.disc{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease,opacity .3s ease;opacity:1}
.disc>.in{overflow:hidden;min-height:0}
.disc.off{grid-template-rows:0fr;opacity:0;pointer-events:none;visibility:hidden;transition:grid-template-rows .35s ease,opacity .3s ease,visibility 0s .35s}
.grp{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#FDFBF8,#fff);padding:18px 14px 0;display:flex;flex-direction:column;position:relative}
.grp>.disc>.in>*{margin-bottom:20px}
.grp>.grp-t{margin-bottom:14px}
.grp:before{content:"";position:absolute;inset:0 0 auto auto;width:4px;height:40px;background:var(--mint);border-radius:0 18px 0 4px}
.grp-t{font-weight:500;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.grp-t .ic{font-size:1.1rem}
.sub-o{margin-top:4px}
/* city */
.combo{position:relative}
.list{position:absolute;z-index:30;inset:calc(100% + 4px) 0 auto 0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(43,38,34,.12);max-height:260px;overflow:auto;padding:6px;display:none}
.list.open{display:block}
.opt{padding:10px 12px;border-radius:10px;cursor:pointer}
.opt[aria-selected=true],.opt:hover{background:var(--gold-soft)}
.opt mark{background:none;color:var(--gold-d);font-weight:500}
.nores{padding:10px 12px;color:var(--muted);font-size:.9rem}
.ok-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mint-d);font-weight:700;display:none}
.fld.okc .ok-ic{display:block}
/* date */
.daterow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.datebtn{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;text-align:right}
.datebtn .ic{color:var(--gold)}
.datebtn small{display:block;color:var(--muted);font-size:.8rem}
.datebtn .ph{color:#A69C92}
.modal{position:fixed;inset:0;z-index:100;background:rgba(30,27,24,.45);display:flex;align-items:flex-end;justify-content:center;animation:fi .2s ease}
@media (min-width:640px){.modal{align-items:center}}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:100%;max-width:420px;border-radius:24px 24px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));animation:su .25s ease}
@media (min-width:640px){.sheet{border-radius:24px}}
@keyframes su{from{transform:translateY(30px)}to{transform:none}}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh button{border:0;background:transparent;cursor:pointer;padding:8px;border-radius:10px}
.calh .ttl{font-weight:500;font-size:1.1rem;padding:6px 12px}
.calh .ttl:hover,.calh .nav:hover{background:var(--gold-soft)}
.calh .nav svg{width:22px;height:22px;stroke:var(--gold-d)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:.8rem;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:transparent;cursor:pointer;font-size:.98rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-variant-numeric:tabular-nums}
.cal button small{font-size:.62rem;color:var(--muted)}
.cal button:hover{background:var(--gold-soft)}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--mint-d)}
.cal button.sel{background:var(--gold);color:#fff}
.cal button.sel small{color:#F3E9D8}
.cal button:disabled{color:#CFC7BD;cursor:default;background:transparent}
.cal button.sat{color:var(--gold-d)}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.months button{padding:14px 4px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.months button.sel{background:var(--gold);color:#fff;border-color:var(--gold)}
.heb{margin:12px 0 4px;text-align:center;color:var(--muted);font-size:.92rem;min-height:1.4em}
.sheet .acts{display:flex;gap:10px;margin-top:10px}
/* files */
.drop{border:1.5px dashed #D8CDBE;border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;background:var(--soft);transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--gold);background:#fff}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop .ic{width:46px;height:46px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;flex:none;font-size:1.3rem}
.drop b{font-weight:500;display:block}
.drop small{color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.th{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--gold-soft);display:grid;place-items:center;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover}
.th.contain img{object-fit:contain;background:#fff;padding:6px}
.th .nm{font-size:.7rem;padding:4px;text-align:center;word-break:break-all;color:var(--muted)}
.th button{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(30,27,24,.7);color:#fff;cursor:pointer;font-size:.95rem;line-height:1}
/* buttons */
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:28px}
.btn{border:0;border-radius:14px;padding:14px 24px;cursor:pointer;background:var(--gold);color:#fff;font-weight:500;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .15s,transform .08s}
.btn:hover{background:var(--gold-d)}
.btn:active{transform:scale(.98)}
.btn.wide{width:100%}
.btn.dark{background:var(--stone)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink);background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tolist{display:block;margin:10px auto 0;font-size:.92rem}
/* welcome */
.wel ul{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px}
.wel li{display:flex;gap:10px;align-items:flex-start}
.wel li .ic{width:30px;height:30px;border-radius:9px;background:var(--mint-soft);display:grid;place-items:center;flex:none;font-size:.95rem}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-top:4px}
/* review */
.rev{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.rsec{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rsec-h{display:flex;justify-content:space-between;align-items:center;background:var(--soft);padding:10px 14px;font-weight:500}
.rsec-h button{border:0;background:transparent;color:var(--gold-d);cursor:pointer;text-decoration:underline;font-size:.9rem}
dl.rows{margin:0;display:grid;grid-template-columns:minmax(110px,38%) 1fr}
dl.rows dt,dl.rows dd{margin:0;padding:9px 14px;border-top:1px solid var(--line);font-size:.93rem}
dl.rows dt{color:var(--muted)}
dl.rows dd{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{padding:10px 14px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-top:18px;font-size:.95rem}
.check input{width:22px;height:22px;accent-color:var(--gold);flex:none;margin-top:2px}
.note{background:var(--mint-soft);border-radius:14px;padding:12px 14px;font-size:.92rem}
.warn{background:var(--err-soft);border-radius:14px;padding:12px 14px;font-size:.92rem;color:#7D3423}
.busy{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;color:var(--muted);text-align:center}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.done-ic{width:70px;height:70px;border-radius:50%;background:var(--mint-soft);display:grid;place-items:center;margin:4px auto 12px;font-size:2rem}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:22px}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.disc,.modal,.sheet{animation:none;transition:none}}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media print{.top,.nav,.noprint,.foot{display:none!important}body{background:#fff}.card{border:0;padding:0}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

function openCal(k){

   body=`<div class="cal" role="grid">${HE_DAYS.map(d=>`<div class="wd">${d}</div>`).join('')}${'<span></span>'.repeat(first)}`;
   for(let d=1;d<=dim;d++){const dt=new Date(view.getFullYear(),view.getMonth(),d);const dis=!f.past&&dt<today;const isSel=sel&&iso(dt)===iso(sel);

  }

  $('#mod').onclick=e=>{if(e.target.id==='mod')close()};

   [['שם העסק',A.biz],['איש/אשת קשר',A.name],['טלפון',A.phone],['סוג העסק',valText(BYK.type)],['עיר',A.city],['שטח',BYK.area?valText(BYK.area):''],['שלב',A.projectStage],['תקציב לביצוע',A.budget],['תאריך פתיחה רצוי',BYK.openDate?valText(BYK.openDate):''],['הגיעו דרך',BYK.source?valText(BYK.source):'']].forEach(([k,v])=>{if(v)fd.append(k,v)});
   fd.append('כל התשובות',summaryText());
   if(link)fd.append('צפייה מלאה ומסודרת',link);
   if(pdf)fd.append('attachment',new File([pdf],pdfName(),{type:'application/pdf'}));
   const r=await fetch(MAIL,{method:'POST',headers:{'Accept':'application/json'},body:fd});
   ok=r.ok;
  }catch(e){ok=false}
 }
 const fileRes=ok?await sendFiles():[];
 A.__done={ok,at:new Date().toISOString(),link,files:fileRes};save();window.__PDF=pdf;render();
}
const DOC=PROGRAM?'פרוגרמה':'שאלון היכרות';

const pdfName=()=>`${DOC} FEINAL - ${(A.biz||'לקוח').replace(/[\\/:*?"<>|]/g,'')}.pdf`;

/* ---- PDF on the FEINAL letterhead ---- */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function buildPdf(){
 for(let i=0;i<40&&!window.jspdf;i++)await new Promise(r=>setTimeout(r,150));
 if(!window.jspdf)throw new Error('no jspdf');
 try{await document.fonts.load('400 30px Heebo');await document.fonts.load('500 30px Heebo');await document.fonts.load('300 30px Heebo')}catch(e){}
 const lh=await loadImg(LH);
 const W=1240,H=1754,R=W-120,Lx=120,TOP=268,BOT=1470;
 const pages=[];let cv,g,y;
 const FONT=(w,s)=>`${w} ${s}px Heebo, Arial, sans-serif`;
 function newPage(){cv=document.createElement('canvas');cv.width=W;cv.height=H;g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(lh,0,0,W,H);g.direction='rtl';g.textAlign='right';g.textBaseline='alphabetic';pages.push(cv);y=TOP}
 function wrap(text,maxW,font){g.font=font;const out=[];String(text).split('\n').forEach(par=>{const words=par.split(/\s+/);let line='';words.forEach(w=>{const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});out.push(line)});return out}
 newPage();
 g.fillStyle='#A8834F';g.font=FONT(300,52);g.fillText(DOC,R,y+40);
 g.fillStyle='#2B2622';g.font=FONT(500,34);g.fillText(A.biz||'',R,y+92);
 g.fillStyle='#7A7068';g.font=FONT(400,22);const now=new Date();
 g.fillText(`${A.name||''}${A.phone?' · '+A.phone:''}${A.email?' · '+A.email:''}`,R,y+130);
 g.fillText(`התקבל ב־${now.getDate()}.${now.getMonth()+1}.${now.getFullYear()}${hebDate(now)?' · '+hebDate(now):''}`,R,y+162);
 y+=200;
 const LABW=330,VALX=R-LABW-24,VALW=VALX-Lx;
 for(const s of summary()){
  if(!s.rows.length)continue;
  if(y+110>BOT)newPage();
  g.font=FONT(500,26);const tw=g.measureText(s.title).width;
  g.fillStyle='#A9D6CF';g.beginPath();g.moveTo(R+14,y);g.lineTo(R-tw-30,y);g.lineTo(R-tw-44,y+44);g.lineTo(R,y+44);g.closePath();g.fill();
  g.fillStyle='#1F3B37';g.fillText(s.title,R-8,y+32);y+=68;
  for(const [lab,val] of s.rows){
   const ll=wrap(lab,LABW,FONT(400,21)),vl=wrap(val,VALW,FONT(400,22));const h=Math.max(ll.length,vl.length)*31+14;
   if(y+h>BOT){newPage()}
   g.fillStyle='#7A7068';g.font=FONT(400,21);ll.forEach((t,i)=>g.fillText(t,R,y+24+i*31));
   g.fillStyle='#2B2622';g.font=FONT(400,22);vl.forEach((t,i)=>g.fillText(t,VALX,y+24+i*31));
   y+=h;g.strokeStyle='#ECE5DB';g.lineWidth=1;g.beginPath();g.moveTo(R,y-6);g.lineTo(Lx,y-6);g.stroke();
  }
  y+=22;
 }
 // images: logo, photos, inspiration
 const groups=[['logo','הלוגו'],['photos','תמונות של המקום'],['keepPhotos','פריטים שנשארים'],['inspo','תמונות השראה']];
 let count=0;
 for(const [k,title] of groups){
  const imgs=(FILES[k]||[]).filter(x=>isImg(x.type));
  for(let i=0;i<imgs.length&&count<16;i++,count++){
   let im;try{const u=URL.createObjectURL(imgs[i].blob);im=await loadImg(u);URL.revokeObjectURL(u)}catch(e){continue}
   const boxH=k==='logo'?380:540;
   if(y+boxH+70>BOT)newPage();
   g.fillStyle='#A8834F';g.font=FONT(500,24);g.fillText(`${title}${imgs.length>1?` (${i+1}/${imgs.length})`:''}`,R,y+28);y+=46;
   const bw=R-Lx,r=Math.min(bw/im.width,boxH/im.height,k==='logo'?1.5:4);const w=im.width*r,h=im.height*r;
   g.drawImage(im,R-w,y,w,h);y+=h+34;
  }
 }
 const {jsPDF}=window.jspdf;
 let q=.78;
 const mk=q=>{const doc=new jsPDF({unit:'pt',format:'a4',compress:true});pages.forEach((c,i)=>{if(i)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',q),'JPEG',0,0,595.28,841.89)});doc.setProperties({title:DOC+' – '+(A.biz||''),author:'FEINAL'});return doc.output('blob')};
 let blob=mk(q);
 while(blob.size>4.6*1024*1024&&q>.35){q-=.12;blob=mk(q)}
 return blob;
}
